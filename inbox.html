<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0c1420">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<title>Inbox · yazartsgallery</title>
</head>
<body class="page inbox-page">
<header class="nav solid" id="nav"><div class="nav-inner">
  <a class="brand" href="./"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#palette"/></svg><span>yazartsgallery</span></a>
  <a class="back" href="./">← Back to the gallery</a>
</div></header>
<main class="page-main wide">
  <section class="login-card" id="login" hidden>
    <svg class="hero-mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#palette"/></svg>
    <h1>Artist inbox</h1>
    <p class="chat-sub">Sign in to read and answer messages and commission requests.</p>
    <form id="loginForm" novalidate>
      <label class="field"><span>Email</span><input name="email" type="email" autocomplete="username" required></label>
      <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit">Sign in</button>
      <p class="form-msg" id="loginMsg" role="status" aria-live="polite"></p>
    </form>
  </section>
  <p class="off-note" id="offNote" hidden>The inbox isn't switched on yet. Follow the "Messages, likes & comments" steps in the README to connect Supabase.</p>

  <section class="inbox" id="inbox" hidden>
    <div class="inbox-bar">
      <div class="tabs" role="tablist">
        <button role="tab" class="tab active" data-tab="messages" aria-selected="true">Messages <b class="badge" id="unreadN" hidden></b></button>
        <button role="tab" class="tab" data-tab="comments" aria-selected="false">Comments</button>
      </div>
      <div class="who"><span id="whoEmail"></span><button class="link-btn" id="signOut" type="button">Sign out</button></div>
    </div>
    <div class="inbox-body" id="tabMessages">
      <ul class="threads" id="threads"></ul>
      <div class="thread-view" id="threadView"><p class="empty-view">Choose a conversation on the left.</p></div>
    </div>
    <div class="mod" id="tabComments" hidden><ul class="mod-list" id="modList"></ul></div>
  </section>
</main>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="palette" viewBox="0 0 32 32"><path fill="currentColor" d="M16 3C8.8 3 3 8.4 3 15.1 3 21.7 8.6 27 15.4 27c1.6 0 2.6-1 2.6-2.3 0-.6-.2-1.1-.6-1.6-.4-.5-.6-1-.6-1.6 0-1.3 1-2.3 2.3-2.3h2.8c4.1 0 7.1-3.1 7.1-6.9C29 7.8 23.2 3 16 3Zm-7.5 13a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm4-5.5a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm7 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm4.5 5.5a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/></symbol>
</svg>
<script src="assets/backend.js" defer></script>
<script src="assets/inbox.js" defer></script>
</body>
</html>
