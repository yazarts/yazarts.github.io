<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yazartsgallery · digital art by @yazarts</title>
<meta name="description" content="yazartsgallery: the digital art portfolio of @yazarts.">
<meta property="og:title" content="yazartsgallery">
<meta property="og:description" content="Digital art by @yazarts.">
<meta property="og:url" content="https://yazarts.github.io/yazartsgallery/">
<link rel="canonical" href="https://yazarts.github.io/yazartsgallery/">
<meta name="theme-color" content="#0c1420">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<a class="skip" href="#gallery">Skip to gallery</a>
<header class="nav" id="nav">
  <div class="nav-inner">
    <a class="brand" href="#home"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#palette"/></svg><span id="brandName">yazartsgallery</span></a>
    <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="menu"><span></span><span></span></button>
    <nav id="menu" aria-label="Main">
      <a href="#home" data-nav="home">Home</a>
      <a href="#gallery" data-nav="gallery">Gallery</a>
      <a href="#about" data-nav="about">About</a>
      <a href="#connect" data-nav="connect">Connect</a>
    </nav>
  </div>
</header>

<main>
  <section class="hero" id="home">
    <div class="hero-bg"><img id="heroImg" src="images/site/banner-placeholder.svg" alt="" fetchpriority="high"></div>
    <div class="hero-shade" aria-hidden="true"></div>
    <div class="hero-content">
      <svg class="hero-mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#palette"/></svg>
      <h1><span id="heroTitle">yazarts</span><small id="heroSubtitle">gallery</small></h1>
      <p id="tagline">Digital art by @yazarts</p>
    </div>
  </section>

  <section class="section" id="gallery" aria-labelledby="gallery-h">
    <div class="section-head fade"><h2 id="gallery-h">Gallery</h2><span class="rule"></span></div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>New artworks are coming soon.</p>
  </section>

  <section class="section about" id="about" aria-labelledby="about-h">
    <div class="section-head fade"><h2 id="about-h">About</h2><span class="rule"></span></div>
    <p class="about-text fade" id="aboutText"></p>
  </section>

  <section class="section connect" id="connect" aria-labelledby="connect-h">
    <div class="section-head fade"><h2 id="connect-h">Connect</h2><span class="rule"></span></div>
    <div class="commission fade" id="commission">
      <span class="status" id="commStatus"><i></i><b>Commissions open</b></span>
      <p id="commText"></p>
    </div>
    <ul class="links fade" id="links"></ul>
  </section>
</main>

<footer class="foot"><span>© <span id="yr"></span> <span id="footName">yazartsgallery</span></span><span>All artwork © @yazarts</span></footer>

<div class="lightbox" id="lb" role="dialog" aria-modal="true" aria-label="Artwork viewer" hidden>
  <div class="lb-bg" aria-hidden="true"></div>
  <div class="lb-tint" id="lbTint" aria-hidden="true"></div>
  <div class="lb-glow" id="lbGlow" aria-hidden="true"></div>
  <div class="lb-stage" id="lbStage" aria-roledescription="carousel" aria-label="Artworks. Swipe or use the arrow keys to browse, pinch or double-tap to zoom.">
    <div class="lb-track" id="lbTrack"></div>
    <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous artwork"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="lb-btn lb-next" id="lbNext" aria-label="Next artwork"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="lb-panel" id="lbPanel">
    <div class="lb-text" id="lbText">
      <h2 class="lb-title" id="lbTitle"></h2>
      <p class="lb-cap" id="lbCap"></p>
      <div class="lb-meta">
        <button class="like" type="button" id="lbLike" aria-pressed="false" aria-label="Like"><svg aria-hidden="true"><use href="#i-heart"/></svg><span class="n" hidden></span></button>
        <span class="lb-idx" id="lbIdx"></span>
      </div>
    </div>
  </div>
  <button class="lb-btn lb-close" id="lbClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <p class="sr" id="lbLive" aria-live="polite"></p>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.3s-7.5-4.4-7.5-10.1A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.5 2.6c0 5.7-7.5 10.1-7.5 10.1Z"/></symbol>
  <symbol id="palette" viewBox="0 0 32 32"><path fill="currentColor" d="M16 3C8.8 3 3 8.4 3 15.1 3 21.7 8.6 27 15.4 27c1.6 0 2.6-1 2.6-2.3 0-.6-.2-1.1-.6-1.6-.4-.5-.6-1-.6-1.6 0-1.3 1-2.3 2.3-2.3h2.8c4.1 0 7.1-3.1 7.1-6.9C29 7.8 23.2 3 16 3Zm-7.5 13a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm4-5.5a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm7 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm4.5 5.5a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/></symbol>
</svg>
<noscript><p style="text-align:center;padding:2rem">Please enable JavaScript to view the gallery.</p></noscript>
<script src="assets/site.js" defer></script>
</body>
</html>
