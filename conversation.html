<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0c1420">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">

<title>Your conversation · yazartsgallery</title>
</head>
<body class="page">
<header class="nav solid" id="nav"><div class="nav-inner">
  <a class="brand" href="./"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#palette"/></svg><span>yazartsgallery</span></a>
  <a class="back" href="./">← Back to the gallery</a>
</div></header>
<main class="page-main">
  <section class="chat-card" id="chat" aria-labelledby="chat-h">
    <div class="chat-head">
      <div><h1 id="chat-h">Your conversation with Yaz</h1><p class="chat-sub" id="chatSub">Loading…</p></div>
      <button class="btn ghost small" type="button" id="copyBtn">Copy private link</button>
    </div>
    <p class="chat-note">This page is private: only you (with this link) and Yaz can see it. Bookmark it to check for replies.</p>
    <ol class="msgs" id="msgs" aria-live="polite"></ol>
    <form class="reply" id="replyForm" novalidate hidden>
      <label class="sr" for="replyBody">Your reply</label>
      <textarea id="replyBody" name="body" rows="3" maxlength="4000" placeholder="Write a reply…" required></textarea>
      <label class="hp" aria-hidden="true">Leave empty <input name="website" tabindex="-1" autocomplete="off"></label>
      <div class="form-foot"><button class="btn" type="submit">Send reply</button><p class="form-msg" id="replyMsg" role="status" aria-live="polite"></p></div>
    </form>
  </section>
</main>

</svg>

</html>
