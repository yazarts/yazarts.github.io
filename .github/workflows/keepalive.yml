# Supabase pauses free projects after ~1 week with no database activity.
# This tiny job asks the database for the like/view counts every 3 days so the
# project stays awake even in quiet weeks. It is free on public repos and does
# nothing until content/integrations.json has your Supabase URL and key.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the database
        run: |
          URL=$(jq -r '.supabaseUrl // ""' content/integrations.json)
          KEY=$(jq -r '.supabaseKey // ""' content/integrations.json)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase not configured yet, nothing to do."; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/get_stats" -H "apikey: $KEY" -H "content-type: application/json" -d '{}' -o /dev/null && echo "Supabase is awake."
