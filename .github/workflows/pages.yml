# Publishes the site to GitHub Pages on every push to main (including every save made in Pages CMS).
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the public files
        run: |
          mkdir _site
          cp -r index.html assets content images .nojekyll _site/
          cp manifest.webmanifest sw.js offline.html _site/
          [ -f CNAME ] && cp CNAME _site/ || true
          [ -f 404.html ] && cp 404.html _site/ || true
          [ -d audio ] && cp -r audio _site/ || true
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: '3.12'
      - name: Make small grid previews (originals are published untouched)
        continue-on-error: true
        run: |
          python -m pip install --quiet pillow
          python scripts/make_thumbs.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
