# Pages CMS configuration. https://pagescms.org/docs/configuration/
# Log in at https://app.pagescms.org with GitHub and open yazarts.github.io.
# Every save is a commit on main. The site republishes in about 1 to 2 minutes.
# Uploads are stored exactly as uploaded.

media:
  - name: images
    label: Images
    input: images
    output: /images
    categories: [image]
    rename: safe
  - name: music
    label: Music
    input: audio
    output: /audio
    extensions: [mp3, m4a, ogg, wav]
    rename: safe

content:
  - name: welcome
    label: Welcome
    type: file
    path: content/welcome.json
    format: json
    fields:
      - name: heroImage
        label: Character image
        description: A PNG with a transparent background floats on the left. Remove it to hide it.
        type: image
        options:
          media: images
          path: images/site
      - name: heroBackground
        label: Background illustration
        description: Fills the welcome section. Wide pictures fit best. Remove it for a plain navy background.
        type: image
        options:
          media: images
      - name: heroTitle
        label: Title
        description: The large heading, such as Welcome.
        type: string
      - name: heroIntro
        label: Intro line
        description: Shown under the title, before the See more button.
        type: text
      - name: bioTitle
        label: About me heading
        description: Heading of the panel that opens from See more.
        type: string
      - name: bio
        label: About me story
        description: The full story. Leave an empty line between paragraphs.
        type: text
      - name: bioPhoto
        label: About me photo
        description: Shown beside the story, and above it on phones.
        type: image
        options:
          media: images
          path: images/site

  - name: portfolio
    label: Portfolio
    type: file
    path: content/portfolio.json
    format: json
    fields:
      - name: artworks
        label: Artworks
        description: Drag to reorder. The first one is the tall tile on the left. Tapping a tile shows the full original.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{index}. Artwork"
        fields:
          - name: image
            label: Image
            type: image
            required: true
            options:
              media: images
              path: images/artworks
          - name: featured
            label: Show bigger
            description: Makes this piece a tall tile. The first artwork is always tall on computers and tablets.
            type: boolean

  - name: commissions
    label: Commissions
    type: file
    path: content/commissions.json
    format: json
    fields:
      - name: open
        label: Commissions open
        description: On shows a green Available badge. Off shows Commissions closed.
        type: boolean
      - name: openText
        label: Message when open
        type: text
      - name: closedText
        label: Message when closed
        type: text
      - name: testimonial
        label: Testimonial
        description: A real quote from someone you have worked with. Leave empty to hide it.
        type: text
      - name: testimonialBy
        label: Testimonial name
        description: Shown only when the quote above is filled in.
        type: string
      - name: tiers
        label: Commission types
        description: One slide each. Drag to reorder. Tapping the photos opens only that type, full screen.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{index}. {name}"
        fields:
          - name: name
            label: Name
            description: Portraits, Half Body, Full Body Character, and so on.
            type: string
            required: true
          - name: description
            label: Description
            type: text
          - name: photos
            label: Photos
            description: Add, remove, or drag to reorder. The first photo sits in front. One photo shows alone. Two or more show as a stack.
            type: image
            list: true
            options:
              media: images
              path: images/commissions
          - name: notes
            label: Note
            description: Short line under the description. Leave empty to hide it.
            type: text

  - name: contact
    label: Contact
    type: file
    path: content/contact.json
    format: json
    fields:
      - name: email
        label: Email address
        description: The first field in Contact. Type the address only, such as name@example.com. It is shown as the envelope icon. Leave it empty to hide the envelope.
        type: string
      - name: buttonLabel
        label: Button text
        description: The button under the commission slides.
        type: string
      - name: contactText
        label: Text above the icons
        type: string
      - name: links
        label: Social links
        description: Drag to reorder. Instagram, TikTok, Reddit, Ko-fi, X, and YouTube get their own icons. Put email in the Email address field.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Name
            type: string
            required: true
          - name: url
            label: Link
            description: Must start with https://
            type: string
            required: true
            pattern: ^https?://.+

  - name: site
    label: Site settings
    type: file
    path: content/site.json
    format: json
    fields:
      - name: siteName
        label: Site name
        description: Shown beside the logo and in the footer.
        type: string
      - name: logo
        label: Logo
        description: The signature in the header. A transparent PNG works best.
        type: image
        options:
          media: images
          path: images/site
      - name: music
        label: Background music
        description: Plays softly on a loop. Remove the file to turn the music off.
        type: file
        options:
          media: music
          extensions: [mp3, m4a, ogg, wav]
