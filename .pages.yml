# Pages CMS configuration — https://pagescms.org/docs/configuration/
# Log in at https://app.pagescms.org with GitHub, open the "yazarts.github.io" repo.
# Uploads are stored exactly as uploaded (Pages CMS never resizes or recompresses them).
media:
  - name: images
    label: Images
    input: images
    output: /images
    categories: [image]
    rename: safe
  - name: music
    label: Music
    input: audio
    output: /audio
    extensions: [mp3, m4a, ogg, wav]
    rename: safe

content:
  - name: portfolio
    label: Portfolio
    type: file
    path: content/portfolio.json
    format: json
    fields:
      - name: artworks
        label: Artworks (drag the handle to reorder; the first one is shown big at the start of the portfolio)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{index}. {title}"
        fields:
          - name: image
            label: Image (any shape works; the portfolio keeps its natural proportions)
            type: image
            required: true
            options:
              media: images
              path: images/artworks
          - name: title
            label: Title (optional)
            type: string
          - name: caption
            label: Caption
            type: text
          - name: featured
            label: Show bigger (a big tile in the portfolio)
            type: boolean
            description: The first artwork is always big. Switch this on to make other pieces big too.

  - name: albums
    label: Albums
    type: file
    path: content/albums.json
    format: json
    fields:
      - name: albums
        label: Albums (drag the handle to reorder; the first one shows first on the site)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Album name
            type: string
            required: true
          - name: cover
            label: Album cover (square image works best)
            type: image
            required: true
            options:
              media: images
              path: images/albums
          - name: description
            label: Description (optional)
            type: text
          - name: music
            label: Album music (optional, plays when a visitor opens the album; mp3, m4a, ogg or wav)
            type: file
            options:
              media: music
              extensions: [mp3, m4a, ogg, wav]
          - name: artworks
            label: Artworks in this album (drag the handle to reorder)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{index}. {title}"
            fields:
              - name: image
                label: Image
                type: image
                required: true
                options:
                  media: images
                  path: images/albums
              - name: title
                label: Title (optional)
                type: string
              - name: caption
                label: Caption
                type: text

  - name: commissions
    label: Commissions
    type: file
    path: content/commissions.json
    format: json
    fields:
      - name: tiers
        label: Commission types (slides; drag the handle to reorder, they switch every 5 seconds). Open/closed is in Site settings.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{index}. {name} ({price})"
        fields:
          - name: name
            label: Tier name (e.g. Portraits, Full Body Character)
            type: string
            required: true
          - name: image
            label: Example image (any shape; your own art works best)
            type: image
            options:
              media: images
              path: images/commissions
          - name: description
            label: Description
            type: text
          - name: price
            label: Price (shown in the outlined box, e.g. $25)
            type: string
          - name: notes
            label: Extra notes (optional, small text under the price)
            type: text

  - name: site
    label: Site settings
    type: file
    path: content/site.json
    format: json
    fields:
      - name: commissionsOpen
        label: Commissions open?
        type: boolean
        description: Switch off to show the "closed" message instead. The commission types themselves are edited under Commissions.
      - name: commissionText
        label: Message when commissions are OPEN
        type: text
      - name: commissionClosedText
        label: Message when commissions are CLOSED
        type: text
      - name: links
        label: Social links (drag to reorder)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Name (e.g. Instagram, TikTok)
            type: string
            required: true
          - name: url
            label: Link (starts with https://)
            type: string
            required: true
            pattern: ^https?://.+
      - name: about
        label: About text
        type: text
      - name: heroImage
        label: Welcome image (use a PNG with a TRANSPARENT background, e.g. a character cut-out; it floats on the page with no box)
        type: image
        options:
          media: images
          path: images/site
      - name: heroImageAlt
        label: Welcome image description (for screen readers)
        type: string
      - name: heroTitle
        label: Welcome title (big text, e.g. Welcome!)
        type: string
      - name: heroSubtitle
        label: Welcome subtitle (e.g. To my portfolio)
        type: string
      - name: heroIntro
        label: Welcome intro (short line under the subtitle)
        type: text
      - name: siteName
        label: Site name (top-left logo and footer)
        type: string
      - name: music
        label: Background music (optional, plays softly on a loop; mp3, m4a, ogg or wav). Remove it to turn the music off.
        type: file
        options:
          media: music
          extensions: [mp3, m4a, ogg, wav]

